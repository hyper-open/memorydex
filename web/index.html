<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>memorydex</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a; --text:#e6e8ee; --muted:#9aa3b2; --accent:#5b9dd9; --working:#8a7dff; --episodic:#e0a24a; --semantic:#4fc08d; --procedural:#d96d9c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .stats { color:var(--muted); font-size:12px; display:flex; gap:10px; }
  header .stats b { color:var(--text); }
  .spacer { flex:1; }
  input, select, textarea, button { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; }
  button { cursor:pointer; background:var(--accent); border-color:transparent; color:#fff; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); border-color:var(--border); font-weight:500; }
  button.ghost:hover { color:var(--text); }
  .toolbar { display:flex; gap:10px; padding:12px 18px; flex-wrap:wrap; align-items:center; }
  .toolbar input.search { flex:1; min-width:220px; }
  .layout { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; padding:0 18px 40px; }
  .col { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; min-height:120px; }
  .col h2 { font-size:13px; margin:0 0 10px; display:flex; align-items:center; gap:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .dot.working{background:var(--working)} .dot.episodic{background:var(--episodic)} .dot.semantic{background:var(--semantic)} .dot.procedural{background:var(--procedural)}
  .count { margin-left:auto; color:var(--muted); font-weight:500; }
  .card { background:var(--panel2); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px; }
  .card.working{border-left-color:var(--working)} .card.episodic{border-left-color:var(--episodic)} .card.semantic{border-left-color:var(--semantic)} .card.procedural{border-left-color:var(--procedural)}
  .card .t { font-weight:600; margin-bottom:4px; }
  .card .c { color:var(--muted); font-size:12.5px; white-space:pre-wrap; max-height:120px; overflow:hidden; }
  .card .c.open { max-height:none; }
  .card .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .tag { font-size:11px; padding:1px 7px; border-radius:999px; background:#2c3240; color:var(--muted); }
  .src { font-size:11px; color:var(--muted); }
  .card .acts { margin-left:auto; display:flex; gap:6px; }
  .card .acts button { padding:2px 8px; font-size:12px; font-weight:500; }
  .empty { color:var(--muted); font-size:12.5px; padding:8px 2px; }
  dialog { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:14px; padding:0; width:min(560px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .dlg { padding:18px; display:grid; gap:10px; }
  .dlg h3 { margin:0; font-size:15px; }
  .dlg label { font-size:12px; color:var(--muted); display:grid; gap:4px; }
  .dlg textarea { min-height:90px; resize:vertical; }
  .dlg .row { display:flex; gap:10px; }
  .dlg .row > label { flex:1; }
  .dlg .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:8px 16px; border-radius:999px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:1000px){ .layout{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:640px){ .layout{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>memorydex</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <button id="importBtn" class="ghost">Import files…</button>
  <button id="syncBtn" class="ghost">Sync</button>
  <button id="newBtn">＋ New memory</button>
</header>
<div class="toolbar">
  <input class="search" id="search" placeholder="Search memories (title / content / tags)…" />
  <select id="tagFilter"><option value="">All tags</option></select>
  <button class="ghost" id="refreshBtn">Refresh</button>
</div>
<div class="layout" id="board"></div>

<dialog id="dlg"><form class="dlg" method="dialog" id="dlgForm">
  <h3 id="dlgTitle">New memory</h3>
  <label>Kind
    <select name="kind">
      <option value="working">working</option><option value="episodic">episodic</option>
      <option value="semantic" selected>semantic</option><option value="procedural">procedural</option>
    </select>
  </label>
  <label>Title <input name="title" required /></label>
  <label>Content <textarea name="content"></textarea></label>
  <div class="row">
    <label>Tags (comma) <input name="tags" placeholder="a, b, c" /></label>
    <label>Importance (0-1) <input name="importance" type="number" min="0" max="1" step="0.1" value="0.5" /></label>
  </div>
  <div class="actions">
    <button type="button" class="ghost" id="dlgCancel">Cancel</button>
    <button type="submit" id="dlgSave">Save</button>
  </div>
</form></dialog>
<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
